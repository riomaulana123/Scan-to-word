<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart OCR Lens Pro+</title>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<!-- TinyMCE -->
<script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js"></script>

<!-- Spreadsheet -->
<script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css"/>

<!-- Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f3f4f6}
header{
background:#111827;color:white;padding:14px;
display:flex;justify-content:space-between;align-items:center
}
header h1{font-size:18px;margin:0}
.tabs{display:flex;background:white}
.tabs button{
flex:1;padding:12px;border:none;background:#e5e7eb;font-weight:600
}
.tabs button.active{background:#2563eb;color:white}
.container{padding:12px}
.card{
background:white;padding:12px;border-radius:14px;
box-shadow:0 6px 16px rgba(0,0,0,.07);margin-bottom:12px
}
button{
padding:10px;border:none;border-radius:10px;
font-weight:600;margin:6px 0;width:100%
}
.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.gray{background:#6b7280;color:white}
.hidden{display:none}
#imageContainer{position:relative;margin-top:10px}
#previewImage{width:100%;border-radius:12px}
#selectionBox{
position:absolute;
border:2px dashed #2563eb;
background:rgba(37,99,235,.2);
display:none
}
</style>
</head>
<body>

<header>
<h1>🚀 Smart OCR Lens Pro+</h1>
<button onclick="saveProject()" class="success">💾 Simpan</button>
</header>

<div class="tabs">
<button onclick="switchMode('word')" id="wordBtn" class="active">📄 Word</button>
<button onclick="switchMode('excel')">📊 Excel</button>
<button onclick="switchMode('projects')">📁 Projek Saya</button>
</div>

<div class="container">

<!-- WORD MODE -->
<div id="wordMode">

<div class="card">
<input type="file" accept="image/*" id="imageInput">
<div id="imageContainer">
<img id="previewImage">
<div id="selectionBox"></div>
</div>
<button class="primary" onclick="scanSelected()">🔍 Scan Area</button>
</div>

<div class="card">
<textarea id="editor"></textarea>
</div>

<div class="card">
<button class="success" onclick="previewDoc()">👁 Preview</button>
<button class="danger" onclick="downloadPDF()">⬇️ PDF</button>
<button class="gray" onclick="printDoc()">🖨️ Print</button>
<button class="primary" onclick="downloadDOCX()">⬇️ Word</button>
</div>

</div>

<!-- EXCEL MODE -->
<div id="excelMode" class="hidden">
<div class="card">
<div id="spreadsheet"></div>
</div>
</div>

<!-- PROJECT MODE -->
<div id="projectMode" class="hidden">
<div class="card">
<div id="projectList"></div>
</div>
</div>

</div>

<script>

/* ===== TINYMCE ===== */
tinymce.init({
selector:'#editor',
height:400,
plugins:'lists table link image code fullscreen',
toolbar:'undo redo | bold italic underline | alignleft aligncenter alignright | bullist numlist | table | fullscreen'
});

/* ===== HANDSONTABLE ===== */
let hot;
setTimeout(()=>{
hot = new Handsontable(document.getElementById('spreadsheet'), {
data: Handsontable.helper.createSpreadsheetData(20,10),
rowHeaders:true,
colHeaders:true,
licenseKey:'non-commercial-and-evaluation'
});
},800);

/* ===== SWITCH MODE ===== */
function switchMode(mode){
document.getElementById('wordMode').classList.add('hidden');
document.getElementById('excelMode').classList.add('hidden');
document.getElementById('projectMode').classList.add('hidden');

if(mode==='word')document.getElementById('wordMode').classList.remove('hidden');
if(mode==='excel')document.getElementById('excelMode').classList.remove('hidden');
if(mode==='projects'){
document.getElementById('projectMode').classList.remove('hidden');
loadProjects();
}
}

/* ===== OCR INIT ===== */
let worker;
(async()=>{
worker = await Tesseract.createWorker();
await worker.loadLanguage('eng');
await worker.initialize('eng');
})();

/* ===== AREA SELECT OCR ===== */
const img=document.getElementById("previewImage");
const container=document.getElementById("imageContainer");
const box=document.getElementById("selectionBox");
let startX,startY,isSelecting=false;

imageInput.onchange=e=>{
const file=e.target.files[0];
if(file) img.src=URL.createObjectURL(file);
};

function getPos(e){
const rect=container.getBoundingClientRect();
return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}

container.addEventListener("mousedown",e=>{
if(!img.src)return;
isSelecting=true;
const p=getPos(e);
startX=p.x;startY=p.y;
box.style.display="block";
box.style.left=startX+"px";
box.style.top=startY+"px";
box.style.width="0px";
box.style.height="0px";
});

container.addEventListener("mousemove",e=>{
if(!isSelecting)return;
const p=getPos(e);
box.style.left=Math.min(startX,p.x)+"px";
box.style.top=Math.min(startY,p.y)+"px";
box.style.width=Math.abs(p.x-startX)+"px";
box.style.height=Math.abs(p.y-startY)+"px";
});

container.addEventListener("mouseup",()=>isSelecting=false);

async function scanSelected(){
if(box.offsetWidth<20)return alert("Blok area dulu");

const scaleX=img.naturalWidth/img.clientWidth;
const scaleY=img.naturalHeight/img.clientHeight;

const x=box.offsetLeft*scaleX;
const y=box.offsetTop*scaleY;
const w=box.offsetWidth*scaleX;
const h=box.offsetHeight*scaleY;

const canvas=document.createElement("canvas");
canvas.width=w;canvas.height=h;
canvas.getContext("2d").drawImage(img,x,y,w,h,0,0,w,h);

const {data}=await worker.recognize(canvas);
tinymce.activeEditor.setContent(data.text.replace(/\n/g,"<br>"));
}

/* ===== PREVIEW ===== */
function previewDoc(){
const content=tinymce.activeEditor.getContent();
const w=window.open("");
w.document.write(`
<html>
<head>
<style>
body{background:#eee;padding:20px}
#a4{width:21cm;min-height:29.7cm;background:white;
margin:auto;padding:2.5cm;font-family:"Times New Roman"}
</style>
</head>
<body>
<div id="a4">${content}</div>
</body>
</html>
`);
}

/* ===== EXPORT ===== */
function downloadDOCX(){
const text=tinymce.activeEditor.getContent({format:'text'});
const doc=new docx.Document({
sections:[{children:[new docx.Paragraph(text)]}]
});
docx.Packer.toBlob(doc).then(b=>saveAs(b,"dokumen.docx"));
}

function downloadPDF(){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
pdf.text(tinymce.activeEditor.getContent({format:'text'}),10,10);
pdf.save("dokumen.pdf");
}

function printDoc(){
const content=tinymce.activeEditor.getContent();
const w=window.open("");
w.document.write(`<html><body onload="window.print();window.close()">${content}</body></html>`);
}

/* ===== PROJECT SAVE ===== */
function saveProject(){
const content=tinymce.activeEditor.getContent();
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
projects.unshift({date:new Date().toLocaleString(),content});
localStorage.setItem("projects",JSON.stringify(projects));
alert("Tersimpan!");
}

function loadProjects(){
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
let html="";
projects.forEach((p,i)=>{
html+=`<div style="margin-bottom:8px">
<button onclick="openProject(${i})">${p.date}</button>
</div>`;
});
document.getElementById("projectList").innerHTML=html||"Belum ada projek";
}

function openProject(i){
let projects=JSON.parse(localStorage.getItem("projects"));
tinymce.activeEditor.setContent(projects[i].content);
switchMode('word');
}

</script>
</body>
</html>
