<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Office Web App</title>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f3f3f3}
.toolbar{background:#222;color:white;padding:10px;display:flex;gap:10px}
button{padding:6px 12px;cursor:pointer}
.hidden{display:none}
#editor{height:300px;background:white}

.preview-container{
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,.5);
display:flex;
justify-content:center;
align-items:center;
overflow:auto;
}
.preview-paper{
width:210mm;
min-height:297mm;
background:white;
padding:20mm;
box-shadow:0 0 10px rgba(0,0,0,.3);
}
table{border-collapse:collapse;width:100%}
td{border:1px solid #999;padding:5px}
</style>
</head>
<body>

<div class="toolbar">
<button onclick="showWord()">Word</button>
<button onclick="showExcel()">Excel</button>

<button onclick="saveWord()">Save Word</button>
<button onclick="previewWord()">Preview Word</button>

<button onclick="saveExcel()">Save Excel</button>
<button onclick="previewExcel()">Preview Excel</button>

<button onclick="document.getElementById('ocrInput').click()">OCR Scan</button>
<input type="file" id="ocrInput" hidden accept="image/*">
</div>

<div id="wordArea">
<div id="editor"></div>
</div>

<div id="excelArea" class="hidden">
<table id="excelTable"></table>
</div>

<div id="previewBox" class="preview-container hidden">
<div>
<div id="previewContent"></div>
<div style="text-align:center;margin-top:10px">
<button onclick="window.print()">Print</button>
<button onclick="closePreview()">Close</button>
</div>
</div>
</div>

<script>
let quill=new Quill('#editor',{theme:'snow'})

function showWord(){
document.getElementById("wordArea").classList.remove("hidden")
document.getElementById("excelArea").classList.add("hidden")
}

function showExcel(){
document.getElementById("excelArea").classList.remove("hidden")
document.getElementById("wordArea").classList.add("hidden")
}

function closePreview(){
document.getElementById("previewBox").classList.add("hidden")
}






// ================= WORD =================

function saveWord(){
let content=quill.root.innerHTML
let blob=new Blob(['<html><body>'+content+'</body></html>'],{type:"application/msword"})
let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="document.doc"
a.click()
}

function previewWord(){
document.getElementById("previewBox").classList.remove("hidden")
document.getElementById("previewContent").innerHTML=
`<div class="preview-paper">${quill.root.innerHTML}</div>`
}





// ================= OCR =================

document.getElementById("ocrInput").addEventListener("change",function(e){
const file=e.target.files[0]
if(!file)return

const reader=new FileReader()
reader.onload=function(){
Tesseract.recognize(reader.result,'ind',{logger:m=>console.log(m)})
.then(({data:{text}})=>{
quill.insertText(quill.getLength(),"\n"+text)
})
}
reader.readAsDataURL(file)
})




// ================= EXCEL =================

const rows=20
const cols=10
let excelData=[]

function initExcel(){
let table=document.getElementById("excelTable")
table.innerHTML=""
excelData=[]

for(let r=0;r<rows;r++){
let row=[]
let tr=document.createElement("tr")
for(let c=0;c<cols;c++){
let td=document.createElement("td")
td.contentEditable=true
td.oninput=function(){ excelData[r][c]=td.innerText }
tr.appendChild(td)
row.push("")
}
table.appendChild(tr)
excelData.push(row)
}
}
initExcel()



function saveExcel(){
let ws=XLSX.utils.aoa_to_sheet(excelData)
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"Sheet1")
XLSX.writeFile(wb,"excel.xlsx")
}

function previewExcel(){
document.getElementById("previewBox").classList.remove("hidden")

let html="<table>"
excelData.forEach(r=>{
html+="<tr>"
r.forEach(c=>{
html+="<td>"+(c||"")+"</td>"
})
html+="</tr>"
})
html+="</table>"

document.getElementById("previewContent").innerHTML=
`<div class="preview-paper">${html}</div>`
}

</script>

</body>
</html>
