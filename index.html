<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart OCR Lens Pro+</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f3f4f6}
header{background:#111827;color:white;padding:14px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
.tabs{display:flex;background:white}
.tabs button{flex:1;padding:12px;border:none;background:#e5e7eb;font-weight:600}
.tabs button.active{background:#2563eb;color:white}
.container{padding:12px}
.card{background:white;padding:12px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.07);margin-bottom:12px}
button{padding:8px;border:none;border-radius:8px;font-weight:600;margin:4px;width:100%}
.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.gray{background:#6b7280;color:white}
.hidden{display:none}
.sheet-tabs{display:flex;margin-top:8px}
.sheet-tabs button{flex:1;background:#e5e7eb}
.sheet-tabs button.active{background:#2563eb;color:white}
#imageContainer{position:relative;margin-top:10px;touch-action:none;user-select:none}
#previewImage{width:100%;border-radius:12px;pointer-events:none}
#selectionBox{position:absolute;border:2px dashed #2563eb;background:rgba(37,99,235,.25);display:none}
</style>
</head>
<body>

<header>
<h1>🚀 Smart OCR Lens Pro+</h1>
<button onclick="saveProject()" class="success">💾 Simpan</button>
</header>

<div class="tabs">
<button onclick="switchMode('word')" class="active">📄 Word</button>
<button onclick="switchMode('excel')">📊 Excel</button>
<button onclick="switchMode('projects')">📁 Projek Saya</button>
</div>

<div class="container">

<!-- WORD MODE -->
<div id="wordMode">
<div class="card">
<input type="file" accept="image/*" id="imageInput">
<div id="imageContainer">
<img id="previewImage">
<div id="selectionBox"></div>
</div>
<button class="primary" onclick="scanSelected()">🔍 Scan Area</button>
</div>

<div class="card">
<div id="editor" style="height:400px;"></div>
</div>

<div class="card">
<button class="success" onclick="previewDoc()">👁 Preview</button>
<button class="danger" onclick="downloadPDF()">⬇️ PDF</button>
<button class="gray" onclick="printDoc()">🖨️ Print</button>
<button class="primary" onclick="downloadDOCX()">⬇️ Word</button>
</div>
</div>

<!-- EXCEL MODE -->
<div id="excelMode" class="hidden">

<div class="card">
<button onclick="addRow()" class="primary">➕ Baris</button>
<button onclick="addCol()" class="primary">➕ Kolom</button>
<button onclick="exportExcel()" class="success">⬇️ Export XLSX</button>
<button onclick="addSheet()" class="gray">➕ Sheet</button>
</div>

<div class="card">
<div id="spreadsheet"></div>
<div class="sheet-tabs" id="sheetTabs"></div>
</div>

</div>

<!-- PROJECT MODE -->
<div id="projectMode" class="hidden">
<div class="card">
<div id="projectList"></div>
</div>
</div>

</div>

<script>

/* WORD */
let quill=new Quill('#editor',{theme:'snow'});

/* ===== EXCEL MULTI SHEET ===== */
let sheets={};
let currentSheet="Sheet1";
let hot;

function createEmptyData(){
return Array.from({length:100},()=>Array(26).fill(null));
}

function initExcel(){
if(hot) hot.destroy();
hot=new Handsontable(document.getElementById('spreadsheet'),{
data:sheets[currentSheet],
rowHeaders:true,
colHeaders:true,
width:'100%',
height:450,
manualColumnResize:true,
manualRowResize:true,
filters:true,
dropdownMenu:true,
contextMenu:true,
formulas:true,
licenseKey:'non-commercial-and-evaluation'
});
renderSheetTabs();
}

function addSheet(){
let name="Sheet"+(Object.keys(sheets).length+1);
sheets[name]=createEmptyData();
currentSheet=name;
initExcel();
}

function switchSheet(name){
currentSheet=name;
initExcel();
}

function renderSheetTabs(){
let html="";
Object.keys(sheets).forEach(name=>{
html+=`<button onclick="switchSheet('${name}')" class="${name===currentSheet?'active':''}">${name}</button>`;
});
document.getElementById("sheetTabs").innerHTML=html;
}

function addRow(){ hot.alter('insert_row'); }
function addCol(){ hot.alter('insert_col'); }

function exportExcel(){
let wb=XLSX.utils.book_new();
Object.keys(sheets).forEach(name=>{
let ws=XLSX.utils.aoa_to_sheet(sheets[name]);
XLSX.utils.book_append_sheet(wb,ws,name);
});
XLSX.writeFile(wb,"SmartOCR.xlsx");
}

setTimeout(()=>{
sheets["Sheet1"]=createEmptyData();
initExcel();
},500);

/* MODE SWITCH */
function switchMode(mode){
wordMode.classList.add('hidden');
excelMode.classList.add('hidden');
projectMode.classList.add('hidden');
if(mode==='word') wordMode.classList.remove('hidden');
if(mode==='excel') excelMode.classList.remove('hidden');
if(mode==='projects'){ projectMode.classList.remove('hidden'); loadProjects(); }
}

/* OCR */
let worker;
(async()=>{
worker=await Tesseract.createWorker();
await worker.loadLanguage('ind+eng');
await worker.initialize('ind+eng');
})();

const img=document.getElementById("previewImage");
const container=document.getElementById("imageContainer");
const box=document.getElementById("selectionBox");
let startX,startY,selecting=false;

imageInput.onchange=e=>{
if(e.target.files[0]) img.src=URL.createObjectURL(e.target.files[0]);
};

container.addEventListener("touchstart",e=>{
if(!img.src)return;
e.preventDefault();
selecting=true;
let r=container.getBoundingClientRect();
let t=e.touches[0];
startX=t.clientX-r.left;
startY=t.clientY-r.top;
box.style.display="block";
box.style.left=startX+"px";
box.style.top=startY+"px";
box.style.width=0;
box.style.height=0;
},{passive:false});

container.addEventListener("touchmove",e=>{
if(!selecting)return;
e.preventDefault();
let r=container.getBoundingClientRect();
let t=e.touches[0];
let x=t.clientX-r.left;
let y=t.clientY-r.top;
box.style.left=Math.min(startX,x)+"px";
box.style.top=Math.min(startY,y)+"px";
box.style.width=Math.abs(x-startX)+"px";
box.style.height=Math.abs(y-startY)+"px";
},{passive:false});

container.addEventListener("touchend",()=>selecting=false);

async function scanSelected(){
if(box.offsetWidth<20)return alert("Blok area dulu");
let scaleX=img.naturalWidth/img.clientWidth;
let scaleY=img.naturalHeight/img.clientHeight;
let canvas=document.createElement("canvas");
canvas.width=box.offsetWidth*scaleX;
canvas.height=box.offsetHeight*scaleY;
canvas.getContext("2d").drawImage(
img,
box.offsetLeft*scaleX,
box.offsetTop*scaleY,
canvas.width,
canvas.height,
0,0,canvas.width,canvas.height
);
let {data}=await worker.recognize(canvas);
quill.root.innerHTML+="<p>"+data.text+"</p>";
box.style.display="none";
}

/* EXPORT WORD */
function downloadPDF(){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
pdf.text(quill.getText(),10,10);
pdf.save("dokumen.pdf");
}

function downloadDOCX(){
const doc=new docx.Document({
sections:[{children:[new docx.Paragraph(quill.getText())]}]
});
docx.Packer.toBlob(doc).then(b=>saveAs(b,"dokumen.docx"));
}

function printDoc(){
const w=window.open("");
w.document.write(`<html><body onload="window.print();window.close()">${quill.root.innerHTML}</body></html>`);
}

function previewDoc(){
const w=window.open("");
w.document.write(`<html><body>${quill.root.innerHTML}</body></html>`);
}

/* PROJECT */
function saveProject(){
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
projects.unshift({date:new Date().toLocaleString(),content:quill.root.innerHTML});
localStorage.setItem("projects",JSON.stringify(projects));
alert("Tersimpan!");
}

function loadProjects(){
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
let html="";
projects.forEach((p,i)=>{
html+=`<button onclick="openProject(${i})">${p.date}</button>`;
});
projectList.innerHTML=html||"Belum ada projek";
}

function openProject(i){
let projects=JSON.parse(localStorage.getItem("projects"));
quill.root.innerHTML=projects[i].content;
switchMode('word');
}

</script>
</body>
</html>
