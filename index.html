<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart OCR Lens Pro+</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f3f4f6}
header{background:#111827;color:white;padding:14px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
.tabs{display:flex;background:white}
.tabs button{flex:1;padding:12px;border:none;background:#e5e7eb;font-weight:600}
.tabs button.active{background:#2563eb;color:white}
.container{padding:12px}
.card{background:white;padding:12px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.07);margin-bottom:12px}
button{padding:10px;border:none;border-radius:10px;font-weight:600;margin:6px 0;width:100%}
.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.gray{background:#6b7280;color:white}
.hidden{display:none}
#imageContainer{position:relative;margin-top:10px;touch-action:none;user-select:none}
#previewImage{width:100%;border-radius:12px;pointer-events:none}
#selectionBox{position:absolute;border:2px dashed #2563eb;background:rgba(37,99,235,.25);display:none}
</style>
</head>
<body>

<header>
<h1>🚀 Smart OCR Lens Pro+</h1>
<button onclick="saveProject()" class="success">💾 Simpan</button>
</header>

<div class="tabs">
<button onclick="switchMode('word')" class="active">📄 Word</button>
<button onclick="switchMode('excel')">📊 Excel</button>
<button onclick="switchMode('projects')">📁 Projek Saya</button>
</div>

<div class="container">

<div id="wordMode">

<div class="card">
<input type="file" accept="image/*" id="imageInput">
<div id="imageContainer">
<img id="previewImage">
<div id="selectionBox"></div>
</div>
<button class="primary" onclick="scanSelected()">🔍 Scan Area</button>
</div>

<div class="card">
<div id="editor" style="height:400px;"></div>
</div>

<div class="card">
<button class="success" onclick="previewDoc()">👁 Preview</button>
<button class="danger" onclick="downloadPDF()">⬇️ PDF</button>
<button class="gray" onclick="printDoc()">🖨️ Print</button>
<button class="primary" onclick="downloadDOCX()">⬇️ Word</button>
</div>

</div>

<div id="excelMode" class="hidden">
<div class="card">
<div id="spreadsheet"></div>
</div>
</div>

<div id="projectMode" class="hidden">
<div class="card">
<div id="projectList"></div>
</div>
</div>

</div>

<script>

/* ========= QUILL ========= */
let quill = new Quill('#editor',{
theme:'snow',
modules:{toolbar:[
['bold','italic','underline'],
[{align:[]}],
[{list:'ordered'},{list:'bullet'}],
['clean']
]}
});

/* ========= EXCEL ========= */
let hot;
setTimeout(()=>{
hot=new Handsontable(document.getElementById('spreadsheet'),{
data:Handsontable.helper.createSpreadsheetData(20,10),
rowHeaders:true,
colHeaders:true,
licenseKey:'non-commercial-and-evaluation'
});
},500);

/* ========= SWITCH ========= */
function switchMode(mode){
document.getElementById('wordMode').classList.add('hidden');
document.getElementById('excelMode').classList.add('hidden');
document.getElementById('projectMode').classList.add('hidden');
if(mode==='word')document.getElementById('wordMode').classList.remove('hidden');
if(mode==='excel')document.getElementById('excelMode').classList.remove('hidden');
if(mode==='projects'){document.getElementById('projectMode').classList.remove('hidden');loadProjects();}
}

/* ========= OCR WORKER ========= */
let worker;
(async()=>{
worker=await Tesseract.createWorker();
await worker.loadLanguage('ind+eng');
await worker.initialize('ind+eng');
await worker.setParameters({
tessedit_pageseg_mode:6,
preserve_interword_spaces:1
});
})();

/* ========= AREA OCR ========= */
const img=document.getElementById("previewImage");
const container=document.getElementById("imageContainer");
const box=document.getElementById("selectionBox");
let startX=0,startY=0,selecting=false;

imageInput.onchange=e=>{
const file=e.target.files[0];
if(file) img.src=URL.createObjectURL(file);
};

function getPos(e){
const rect=container.getBoundingClientRect();
const t=e.touches?e.touches[0]:e;
return{x:t.clientX-rect.left,y:t.clientY-rect.top};
}

container.addEventListener("touchstart",e=>{
if(!img.src)return;
e.preventDefault();
selecting=true;
const p=getPos(e);
startX=p.x;startY=p.y;
box.style.display="block";
box.style.left=startX+"px";
box.style.top=startY+"px";
box.style.width=0;
box.style.height=0;
},{passive:false});

container.addEventListener("touchmove",e=>{
if(!selecting)return;
e.preventDefault();
const p=getPos(e);
box.style.left=Math.min(startX,p.x)+"px";
box.style.top=Math.min(startY,p.y)+"px";
box.style.width=Math.abs(p.x-startX)+"px";
box.style.height=Math.abs(p.y-startY)+"px";
},{passive:false});

container.addEventListener("touchend",()=>selecting=false);

/* ========= OCR RAPI FIX ========= */
async function scanSelected(){
if(box.offsetWidth<20)return alert("Blok area dulu");

quill.setText("Scanning...");

const scaleX=img.naturalWidth/img.clientWidth;
const scaleY=img.naturalHeight/img.clientHeight;

const x=box.offsetLeft*scaleX;
const y=box.offsetTop*scaleY;
const w=box.offsetWidth*scaleX;
const h=box.offsetHeight*scaleY;

const canvas=document.createElement("canvas");
canvas.width=w;canvas.height=h;
canvas.getContext("2d").drawImage(img,x,y,w,h,0,0,w,h);

const {data}=await worker.recognize(canvas);

let text=data.text;

/* ==== AUTO FORMAT ==== */
text=text.replace(/[ \t]+/g," ");
text=text.replace(/([a-zA-Z0-9,])\n([a-z])/g,"$1 $2");
text=text.replace(/\n-/g,"\n• ");
text=text.replace(/\n{3,}/g,"\n\n");
text=text.trim();

let formatted=text
.split("\n\n")
.map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`)
.join("");

quill.root.innerHTML=formatted;
}

/* ========= PREVIEW ========= */
function previewDoc(){
const content=quill.root.innerHTML;
const w=window.open("");
w.document.write(`
<html>
<head>
<style>
body{background:#eee;padding:20px}
#a4{width:21cm;min-height:29.7cm;background:white;margin:auto;padding:2.5cm;font-family:"Times New Roman"}
</style>
</head>
<body>
<div id="a4">${content}</div>
</body>
</html>
`);
}

/* ========= EXPORT ========= */
function downloadPDF(){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
pdf.text(quill.getText(),10,10);
pdf.save("dokumen.pdf");
}

function downloadDOCX(){
const doc=new docx.Document({
sections:[{children:[new docx.Paragraph(quill.getText())]}]
});
docx.Packer.toBlob(doc).then(b=>saveAs(b,"dokumen.docx"));
}

function printDoc(){
const w=window.open("");
w.document.write(`<html><body onload="window.print();window.close()">${quill.root.innerHTML}</body></html>`);
}

/* ========= PROJECT ========= */
function saveProject(){
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
projects.unshift({date:new Date().toLocaleString(),content:quill.root.innerHTML});
localStorage.setItem("projects",JSON.stringify(projects));
alert("Tersimpan!");
}

function loadProjects(){
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
let html="";
projects.forEach((p,i)=>{
html+=`<div style="margin-bottom:8px">
<button onclick="openProject(${i})">${p.date}</button>
</div>`;
});
document.getElementById("projectList").innerHTML=html||"Belum ada projek";
}

function openProject(i){
let projects=JSON.parse(localStorage.getItem("projects"));
quill.root.innerHTML=projects[i].content;
switchMode('word');
}

</script>
</body>
</html>
