<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart OCR Lens Pro+</title>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<!-- TinyMCE -->
<script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js"></script>

<!-- Spreadsheet -->
<script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css"/>

<!-- Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f4f6fb}
header{
background:#111827;color:white;padding:14px;
display:flex;justify-content:space-between;align-items:center
}
header h1{font-size:18px;margin:0}
.tabs{display:flex;background:white}
.tabs button{
flex:1;padding:12px;border:none;background:#e5e7eb;font-weight:600
}
.tabs button.active{background:#2563eb;color:white}
.container{padding:12px}
.card{
background:white;padding:12px;border-radius:14px;
box-shadow:0 6px 16px rgba(0,0,0,.07);margin-bottom:12px
}
button{
padding:10px;border:none;border-radius:10px;
font-weight:600;margin:4px 0
}
.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.gray{background:#6b7280;color:white}
.hidden{display:none}
#a4Preview{
width:21cm;min-height:29.7cm;
background:white;margin:auto;padding:2.5cm;
box-shadow:0 0 15px rgba(0,0,0,.15)
}
</style>
</head>
<body>

<header>
<h1>🚀 Smart OCR Lens Pro+</h1>
<button onclick="saveProject()" class="success">💾 Simpan</button>
</header>

<div class="tabs">
<button id="wordTab" class="active" onclick="switchMode('word')">📄 Word</button>
<button onclick="switchMode('excel')">📊 Excel</button>
<button onclick="switchMode('projects')">📁 Projek Saya</button>
</div>

<div class="container">

<!-- WORD MODE -->
<div id="wordMode">

<div class="card">
<input type="file" accept="image/*" id="imageInput">
<button class="primary" onclick="scanOCR()">🔍 Scan OCR</button>
</div>

<div class="card">
<textarea id="editor"></textarea>
</div>

<div class="card">
<button class="success" onclick="previewDoc()">👁 Preview</button>
<button class="danger" onclick="downloadPDF()">⬇️ PDF</button>
<button class="gray" onclick="printDoc()">🖨️ Print</button>
<button class="primary" onclick="downloadDOCX()">⬇️ Word</button>
</div>

</div>

<!-- EXCEL MODE -->
<div id="excelMode" class="hidden">
<div class="card">
<div id="spreadsheet"></div>
</div>
</div>

<!-- PROJECTS -->
<div id="projectMode" class="hidden">
<div class="card">
<div id="projectList"></div>
</div>
</div>

</div>

<script>

/* ===== INIT WORD EDITOR ===== */
tinymce.init({
selector:'#editor',
height:400,
plugins:'lists table link image code fullscreen',
toolbar:'undo redo | bold italic underline | alignleft aligncenter alignright | bullist numlist | table | fullscreen'
});

/* ===== INIT EXCEL ===== */
let hot;
setTimeout(()=>{
hot = new Handsontable(document.getElementById('spreadsheet'), {
data: Handsontable.helper.createSpreadsheetData(20,10),
rowHeaders:true,
colHeaders:true,
licenseKey:'non-commercial-and-evaluation'
});
},1000);

/* ===== SWITCH MODE ===== */
function switchMode(mode){
document.getElementById('wordMode').classList.add('hidden');
document.getElementById('excelMode').classList.add('hidden');
document.getElementById('projectMode').classList.add('hidden');

if(mode==='word')document.getElementById('wordMode').classList.remove('hidden');
if(mode==='excel')document.getElementById('excelMode').classList.remove('hidden');
if(mode==='projects'){ 
document.getElementById('projectMode').classList.remove('hidden');
loadProjects();
}
}

/* ===== OCR FAST ===== */
let worker;
(async()=>{
worker = await Tesseract.createWorker();
await worker.loadLanguage('eng');
await worker.initialize('eng');
})();

async function scanOCR(){
const file=document.getElementById('imageInput').files[0];
if(!file) return alert("Pilih gambar dulu");

const {data}=await worker.recognize(file);
tinymce.activeEditor.setContent(data.text.replace(/\n/g,"<br>"));
}

/* ===== PREVIEW A4 ===== */
function previewDoc(){
const content=tinymce.activeEditor.getContent();
const w=window.open("");
w.document.write(`
<html>
<head>
<style>
body{background:#eee;padding:20px}
#a4{width:21cm;min-height:29.7cm;background:white;
margin:auto;padding:2.5cm;font-family:"Times New Roman"}
</style>
</head>
<body>
<div id="a4">${content}</div>
</body>
</html>
`);
}

/* ===== EXPORT ===== */
function downloadDOCX(){
const text=tinymce.activeEditor.getContent({format:'text'});
const doc=new docx.Document({
sections:[{children:[new docx.Paragraph(text)]}]
});
docx.Packer.toBlob(doc).then(b=>saveAs(b,"dokumen.docx"));
}

function downloadPDF(){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
pdf.text(tinymce.activeEditor.getContent({format:'text'}),10,10);
pdf.save("dokumen.pdf");
}

function printDoc(){
const content=tinymce.activeEditor.getContent();
const w=window.open("");
w.document.write(`
<html><body onload="window.print();window.close()">
${content}
</body></html>`);
}

/* ===== PROJECT SAVE ===== */
function saveProject(){
const content=tinymce.activeEditor.getContent();
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
projects.unshift({date:new Date().toLocaleString(),content});
localStorage.setItem("projects",JSON.stringify(projects));
alert("Tersimpan!");
}

function loadProjects(){
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
let html="";
projects.forEach((p,i)=>{
html+=`<div style="margin-bottom:8px">
<button onclick="openProject(${i})">${p.date}</button>
</div>`;
});
document.getElementById("projectList").innerHTML=html||"Belum ada projek";
}

function openProject(i){
let projects=JSON.parse(localStorage.getItem("projects"));
tinymce.activeEditor.setContent(projects[i].content);
switchMode('word');
}

</script>

</body>
</html>
