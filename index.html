<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart OCR Lens Pro+</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f3f4f6}
header{background:#111827;color:white;padding:14px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
.tabs{display:flex;background:white}
.tabs button{flex:1;padding:12px;border:none;background:#e5e7eb;font-weight:600}
.tabs button.active{background:#2563eb;color:white}
.container{padding:12px}
.card{background:white;padding:12px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.07);margin-bottom:12px}
button{padding:8px;border:none;border-radius:8px;font-weight:600;margin:4px;width:100%}
.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.gray{background:#6b7280;color:white}
.hidden{display:none}
.sheet-tabs{display:flex;margin-top:8px}
.sheet-tabs button{flex:1;background:#e5e7eb}
.sheet-tabs button.active{background:#2563eb;color:white}
.preview-paper{
width:210mm;
min-height:297mm;
background:white;
margin:20px auto;
padding:20mm;
box-shadow:0 0 10px rgba(0,0,0,.2);
}
#printPreview{max-height:500px;overflow:auto}
</style>
</head>
<body>

<header>
<h1>🚀 Smart OCR Lens Pro+</h1>
<button onclick="saveProject()" class="success">💾 Simpan</button>
</header>

<div class="tabs">
<button onclick="switchMode('word')" class="active">📄 Word</button>
<button onclick="switchMode('excel')">📊 Excel</button>
<button onclick="switchMode('projects')">📁 Projek Saya</button>
</div>

<div class="container">

<!-- WORD MODE -->
<div id="wordMode">
<div class="card">
<div id="editor" style="height:400px;"></div>
</div>

<div class="card">
<button class="primary" onclick="previewWord()">👁 Preview</button>
<button class="gray" onclick="printWord()">🖨️ Print</button>
<button class="danger" onclick="downloadPDF()">⬇️ PDF</button>
<button class="success" onclick="downloadDOCX()">⬇️ Word</button>
</div>
</div>

<!-- EXCEL MODE -->
<div id="excelMode" class="hidden">

<div class="card">
<button onclick="addRow()" class="primary">➕ Baris</button>
<button onclick="addCol()" class="primary">➕ Kolom</button>
<button onclick="exportExcel()" class="success">⬇️ Export XLSX</button>
<button onclick="previewExcel()" class="danger">👁 Preview</button>
<button onclick="printExcel()" class="gray">🖨️ Print</button>
<button onclick="addSheet()" class="primary">➕ Sheet</button>
</div>

<div class="card">
<div id="spreadsheet"></div>
<div class="sheet-tabs" id="sheetTabs"></div>
</div>
</div>

<!-- PROJECT MODE -->
<div id="projectMode" class="hidden">
<div class="card">
<div id="projectList"></div>
</div>
</div>

<!-- PREVIEW GLOBAL -->
<div class="card hidden" id="previewCard">
<h3>Print Preview</h3>
<div id="printPreview"></div>
</div>

</div>

<script>

/* WORD */
let quill=new Quill('#editor',{theme:'snow'});

/* EXCEL */
let sheets={};
let currentSheet="Sheet1";
let hot;

function createEmptyData(){
return Array.from({length:100},()=>Array(26).fill(null));
}

function initExcel(){
if(hot) hot.destroy();
hot=new Handsontable(document.getElementById('spreadsheet'),{
data:sheets[currentSheet],
rowHeaders:true,
colHeaders:true,
width:'100%',
height:450,
manualColumnResize:true,
manualRowResize:true,
contextMenu:true,
filters:true,
dropdownMenu:true,
formulas:true,
licenseKey:'non-commercial-and-evaluation'
});
renderSheetTabs();
}

function addSheet(){
let name="Sheet"+(Object.keys(sheets).length+1);
sheets[name]=createEmptyData();
currentSheet=name;
initExcel();
}

function switchSheet(name){
currentSheet=name;
initExcel();
}

function renderSheetTabs(){
let html="";
Object.keys(sheets).forEach(name=>{
html+=`<button onclick="switchSheet('${name}')" class="${name===currentSheet?'active':''}">${name}</button>`;
});
sheetTabs.innerHTML=html;
}

function addRow(){ hot.alter('insert_row'); }
function addCol(){ hot.alter('insert_col'); }

function getUsedRange(data){
let maxRow=0,maxCol=0;
for(let r=0;r<data.length;r++){
for(let c=0;c<data[r].length;c++){
if(data[r][c]!=null && data[r][c]!=""){
if(r>maxRow) maxRow=r;
if(c>maxCol) maxCol=c;
}
}
}
return data.slice(0,maxRow+1).map(row=>row.slice(0,maxCol+1));
}

function exportExcel(){
sheets[currentSheet]=hot.getData();
let wb=XLSX.utils.book_new();
Object.keys(sheets).forEach(name=>{
let used=getUsedRange(sheets[name]);
if(used.length>0){
let ws=XLSX.utils.aoa_to_sheet(used);
XLSX.utils.book_append_sheet(wb,ws,name);
}
});
XLSX.writeFile(wb,"SmartOCR.xlsx");
}

function buildTableHTML(data){
let html="<table border='1' style='border-collapse:collapse;width:100%'>";
data.forEach(row=>{
html+="<tr>";
row.forEach(cell=>{
html+="<td style='padding:6px'>"+(cell||"")+"</td>";
});
html+="</tr>";
});
html+="</table>";
return html;
}

/* PREVIEW */
function previewWord(){
previewCard.classList.remove('hidden');
printPreview.innerHTML=`<div class="preview-paper">${quill.root.innerHTML}</div>`;
}

function previewExcel(){
sheets[currentSheet]=hot.getData();
let used=getUsedRange(sheets[currentSheet]);
if(used.length===0){alert("Tidak ada data");return;}
previewCard.classList.remove('hidden');
printPreview.innerHTML=`<div class="preview-paper">${buildTableHTML(used)}</div>`;
}

/* PRINT */
function printWord(){
let w=window.open("");
w.document.write(`
<html><head>
<style>
@media print{@page{size:A4;margin:0}}
.preview-paper{width:210mm;min-height:297mm;padding:20mm}
</style>
</head>
<body onload="window.print();window.close()">
<div class="preview-paper">${quill.root.innerHTML}</div>
</body></html>`);
}

function printExcel(){
sheets[currentSheet]=hot.getData();
let used=getUsedRange(sheets[currentSheet]);
if(used.length===0){alert("Tidak ada data");return;}
let html=buildTableHTML(used);
let w=window.open("");
w.document.write(`
<html><head>
<style>
@media print{@page{size:A4 landscape;margin:0}}
.preview-paper{width:297mm;min-height:210mm;padding:20mm}
</style>
</head>
<body onload="window.print();window.close()">
<div class="preview-paper">${html}</div>
</body></html>`);
}

/* SAVE PROJECT */
function saveProject(){
sheets[currentSheet]=hot?hot.getData():sheets[currentSheet];
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
projects.unshift({
date:new Date().toLocaleString(),
word:quill.root.innerHTML,
excel:JSON.parse(JSON.stringify(sheets))
});
localStorage.setItem("projects",JSON.stringify(projects));
alert("Word & Excel berhasil disimpan!");
}

function loadProjects(){
let projects=JSON.parse(localStorage.getItem("projects")||"[]");
let html="";
projects.forEach((p,i)=>{
html+=`<button onclick="openProject(${i})">${p.date}</button>`;
});
projectList.innerHTML=html||"Belum ada projek";
}

function openProject(i){
let projects=JSON.parse(localStorage.getItem("projects"));
let data=projects[i];
quill.root.innerHTML=data.word||"";
sheets=data.excel||{"Sheet1":createEmptyData()};
currentSheet=Object.keys(sheets)[0];
initExcel();
switchMode('word');
}

/* INIT */
setTimeout(()=>{
sheets["Sheet1"]=createEmptyData();
initExcel();
},500);

function switchMode(mode){
wordMode.classList.add('hidden');
excelMode.classList.add('hidden');
projectMode.classList.add('hidden');
previewCard.classList.add('hidden');
if(mode==='word') wordMode.classList.remove('hidden');
if(mode==='excel') excelMode.classList.remove('hidden');
if(mode==='projects'){projectMode.classList.remove('hidden');loadProjects();}
}

</script>
</body>
</html>
