<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Web Mobile Pro</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4.11.1/dist/jspreadsheet.css"/>
<script src="https://cdn.jsdelivr.net/npm/jsuites@4.9.10/dist/jsuites.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4.11.1/dist/jspreadsheet.js"></script>

<style>
body{
margin:0;
font-family:Calibri, sans-serif;
background:#f4f4f4;
overflow:hidden;
}

/* Toolbar */
.toolbar{
display:flex;
flex-wrap:wrap;
gap:5px;
padding:6px;
background:#e6e6e6;
border-bottom:1px solid #ccc;
}

.toolbar button,
.toolbar select,
.toolbar input{
padding:6px 8px;
font-size:13px;
border:1px solid #bbb;
background:white;
border-radius:4px;
}

/* Formula Bar */
.formula-bar{
display:flex;
padding:5px;
background:white;
border-bottom:1px solid #ccc;
}

#formulaInput{
flex:1;
padding:5px;
border:1px solid #ccc;
}

/* Spreadsheet area */
#spreadsheet{
height:calc(100vh - 110px);
overflow:auto;
}

/* Make table full screen */
.jexcel{
width:100% !important;
}

</style>
</head>

<body>

<div class="toolbar">

<button onclick="formatStyle('font-weight','bold')"><b>B</b></button>
<button onclick="formatStyle('font-style','italic')"><i>I</i></button>
<button onclick="formatStyle('text-decoration','underline')"><u>U</u></button>

<select onchange="formatStyle('font-size',this.value+'px')">
<option value="12">12</option>
<option value="14">14</option>
<option value="16">16</option>
<option value="18">18</option>
<option value="20">20</option>
</select>

<input type="color" onchange="formatStyle('color',this.value)">
<input type="color" onchange="formatStyle('background-color',this.value)">

<button onclick="alignText('left')">Left</button>
<button onclick="alignText('center')">Center</button>
<button onclick="alignText('right')">Right</button>

<button onclick="mergeCell()">Merge</button>

<button onclick="insertRow()">+Row</button>
<button onclick="insertColumn()">+Col</button>
<button onclick="deleteRow()">-Row</button>
<button onclick="deleteColumn()">-Col</button>

</div>

<div class="formula-bar">
<input id="formulaInput" placeholder="Masukkan nilai atau rumus...">
</div>

<div id="spreadsheet"></div>

<script>

let sheet = jspreadsheet(document.getElementById('spreadsheet'),{
minDimensions:[20,50],
tableOverflow:true,
tableHeight:"100%",
allowInsertColumn:true,
allowInsertRow:true,
allowDeleteColumn:true,
allowDeleteRow:true,
columnDrag:true,
rowDrag:true,
onselection:function(instance,x1,y1){
document.getElementById("formulaInput").value=
instance.getValueFromCoords(x1,y1);
}
});

/* Formula input */
document.getElementById("formulaInput").addEventListener("change",function(){
let selected = sheet.getSelected();
sheet.setValue(selected,this.value);
});

/* Formatting */
function formatStyle(property,value){
sheet.setStyle(sheet.getSelected(),property,value);
}

function alignText(position){
sheet.setStyle(sheet.getSelected(),'text-align',position);
}

function mergeCell(){
sheet.setMerge(sheet.getSelected());
}

/* Row & Column */
function insertRow(){
sheet.insertRow();
}

function insertColumn(){
sheet.insertColumn();
}

function deleteRow(){
sheet.deleteRow();
}

function deleteColumn(){
sheet.deleteColumn();
}

</script>

</body>
</html>
