<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart OCR Lens Pro+</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f3f4f6}
header{background:#111827;color:white;padding:14px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
.tabs{display:flex;background:white}
.tabs button{flex:1;padding:12px;border:none;background:#e5e7eb;font-weight:600}
.tabs button.active{background:#2563eb;color:white}
.container{padding:12px}
.card{background:white;padding:12px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.07);margin-bottom:12px}
button{padding:8px;border:none;border-radius:8px;font-weight:600;margin:4px;width:100%}
.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.gray{background:#6b7280;color:white}
.hidden{display:none}
#previewImage{max-width:100%;display:none;touch-action:none}
#imageContainer{position:relative;margin-top:10px}
#selectionBox{position:absolute;border:2px dashed red;display:none;pointer-events:none}
.preview-box{border:1px solid #ddd;padding:10px;margin-top:10px}
</style>
</head>
<body>

<header>
<h1>🚀 Smart OCR Lens Pro+</h1>
<button onclick="saveWordProject()" class="success">💾 Simpan</button>
</header>

<div class="tabs">
<button onclick="switchMode('word')" class="active">📄 Word</button>
<button onclick="switchMode('excel')">📊 Excel</button>
<button onclick="switchMode('projects')">📁 Projek Saya</button>
</div>

<div class="container">

<!-- WORD MODE -->
<div id="wordMode">

<div class="card">
<input type="file" accept="image/*" id="imageInput">
<div id="imageContainer">
<img id="previewImage">
<div id="selectionBox"></div>
</div>
<button class="primary" onclick="scanSelected()">🔍 Scan Area</button>
</div>

<div class="card">
<div id="editor" style="height:400px;"></div>
</div>

<div class="card">
<button class="success" onclick="previewWord()">👁 Preview</button>
<button class="danger" onclick="downloadPDF()">⬇️ PDF</button>
<button class="gray" onclick="printWord()">🖨️ Print</button>
<button class="primary" onclick="downloadDOCX()">⬇️ Word</button>
</div>

<div class="card hidden" id="wordPreviewCard">
<h3>Preview Word</h3>
<div id="wordPreview" class="preview-box"></div>
</div>

</div>

<!-- EXCEL MODE -->
<div id="excelMode" class="hidden">

<div class="card">
<button onclick="addRow()" class="primary">➕ Baris</button>
<button onclick="addCol()" class="primary">➕ Kolom</button>
<button onclick="exportExcel()" class="success">⬇️ Export XLSX</button>
<button onclick="saveExcelProject()" class="success">💾 Simpan Excel</button>
<button onclick="previewExcel()" class="danger">👁 Preview</button>
<button onclick="printExcel()" class="gray">🖨️ Print</button>
<button onclick="addSheet()" class="primary">➕ Sheet</button>
</div>

<div class="card">
<div id="spreadsheet"></div>
</div>

<div class="card hidden" id="excelPreviewCard">
<h3>Preview Excel</h3>
<div id="excelPreview" class="preview-box"></div>
</div>

</div>

<!-- PROJECT MODE -->
<div id="projectMode" class="hidden">
<div class="card">
<div id="projectList"></div>
</div>
</div>

</div>

<script>

/* ================= WORD ================= */
let quill=new Quill('#editor',{theme:'snow'});

function previewWord(){
wordPreview.innerHTML=quill.root.innerHTML;
wordPreviewCard.classList.remove('hidden');
}

function printWord(){
let w=window.open("");
w.document.write("<html><body onload='window.print()'>"+quill.root.innerHTML+"</body></html>");
}

async function downloadPDF(){
const {jsPDF}=window.jspdf;
let doc=new jsPDF();
doc.html(quill.root.innerHTML,{callback:function(doc){doc.save("SmartOCR.pdf");}});
}

function downloadDOCX(){
const {Document,Packer,Paragraph}=docx;
let doc=new Document({
sections:[{
children:[new Paragraph(quill.getText())]
}]
});
Packer.toBlob(doc).then(blob=>saveAs(blob,"SmartOCR.docx"));
}

function saveWordProject(){
localStorage.setItem("wordProject",quill.root.innerHTML);
alert("Word tersimpan!");
}

/* ================= OCR ================= */
const imageInput=document.getElementById("imageInput");
const previewImage=document.getElementById("previewImage");
const imageContainer=document.getElementById("imageContainer");
const selectionBox=document.getElementById("selectionBox");

let startX,startY,endX,endY,isSelecting=false,selectedArea=null;

imageInput.addEventListener("change",e=>{
const file=e.target.files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=ev=>{
previewImage.src=ev.target.result;
previewImage.style.display="block";
};
reader.readAsDataURL(file);
});

function getPos(e){
const rect=imageContainer.getBoundingClientRect();
if(e.touches){
return {x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top};
}
return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}

function startSelect(e){
if(!previewImage.src) return;
isSelecting=true;
selectionBox.style.display="block";
const pos=getPos(e);
startX=pos.x; startY=pos.y;
selectionBox.style.left=startX+"px";
selectionBox.style.top=startY+"px";
selectionBox.style.width="0px";
selectionBox.style.height="0px";
}

function moveSelect(e){
if(!isSelecting) return;
e.preventDefault();
const pos=getPos(e);
endX=pos.x; endY=pos.y;
selectionBox.style.width=Math.abs(endX-startX)+"px";
selectionBox.style.height=Math.abs(endY-startY)+"px";
selectionBox.style.left=Math.min(startX,endX)+"px";
selectionBox.style.top=Math.min(startY,endY)+"px";
}

function endSelect(){
isSelecting=false;
selectedArea={
x:parseInt(selectionBox.style.left),
y:parseInt(selectionBox.style.top),
width:parseInt(selectionBox.style.width),
height:parseInt(selectionBox.style.height)
};
}

imageContainer.addEventListener("mousedown",startSelect);
imageContainer.addEventListener("mousemove",moveSelect);
imageContainer.addEventListener("mouseup",endSelect);
imageContainer.addEventListener("touchstart",startSelect);
imageContainer.addEventListener("touchmove",moveSelect);
imageContainer.addEventListener("touchend",endSelect);

async function scanSelected(){
if(!previewImage.src||!selectedArea) return alert("Pilih area dulu!");
const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");
const img=new Image();
img.src=previewImage.src;
img.onload=async()=>{
const scaleX=img.naturalWidth/previewImage.clientWidth;
const scaleY=img.naturalHeight/previewImage.clientHeight;
canvas.width=selectedArea.width*scaleX;
canvas.height=selectedArea.height*scaleY;
ctx.drawImage(img,
selectedArea.x*scaleX,
selectedArea.y*scaleY,
selectedArea.width*scaleX,
selectedArea.height*scaleY,
0,0,canvas.width,canvas.height);
const result=await Tesseract.recognize(canvas,"ind+eng");
quill.root.innerHTML+="<p>"+result.data.text+"</p>";
};
}

/* ================= EXCEL ================= */
let hot;
function initExcel(){
hot=new Handsontable(document.getElementById('spreadsheet'),{
data:Handsontable.helper.createSpreadsheetData(50,20),
rowHeaders:true,colHeaders:true,
licenseKey:'non-commercial-and-evaluation'
});
}
setTimeout(initExcel,500);

function addRow(){hot.alter('insert_row');}
function addCol(){hot.alter('insert_col');}

function exportExcel(){
let wb=XLSX.utils.book_new();
let ws=XLSX.utils.aoa_to_sheet(hot.getData());
XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
XLSX.writeFile(wb,"SmartOCR.xlsx");
}

function previewExcel(){
excelPreview.innerHTML=hot.getData().map(r=>"<div>"+r.join(" | ")+"</div>").join("");
excelPreviewCard.classList.remove('hidden');
}

function printExcel(){
let w=window.open("");
w.document.write("<html><body onload='window.print()'>"+excelPreview.innerHTML+"</body></html>");
}

function saveExcelProject(){
localStorage.setItem("excelProject",JSON.stringify(hot.getData()));
alert("Excel tersimpan!");
}

/* ================= MODE ================= */
function switchMode(mode){
wordMode.classList.add('hidden');
excelMode.classList.add('hidden');
projectMode.classList.add('hidden');
if(mode==='word') wordMode.classList.remove('hidden');
if(mode==='excel') excelMode.classList.remove('hidden');
}

</script>
</body>
</html>
