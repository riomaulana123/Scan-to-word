<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart OCR Lens Pro+</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f3f4f6}
header{background:#111827;color:white;padding:14px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
.tabs{display:flex;background:white}
.tabs button{flex:1;padding:12px;border:none;background:#e5e7eb;font-weight:600}
.tabs button.active{background:#2563eb;color:white}
.container{padding:12px}
.card{background:white;padding:12px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.07);margin-bottom:12px}
button{padding:8px;border:none;border-radius:8px;font-weight:600;margin:4px;width:100%}
.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.gray{background:#6b7280;color:white}
.hidden{display:none}
#imageContainer{position:relative}
#previewImage{max-width:100%;display:none;border-radius:12px}
#selectionBox{
position:absolute;
border:2px dashed red;
display:none;
pointer-events:none;
}
</style>
</head>
<body>

<header>
<h1>🚀 Smart OCR Lens Pro+</h1>
<button onclick="saveProject()" class="success">💾 Simpan</button>
</header>

<div class="tabs">
<button onclick="switchMode('word')" class="active">📄 Word</button>
<button onclick="switchMode('excel')">📊 Excel</button>
<button onclick="switchMode('projects')">📁 Projek Saya</button>
</div>

<div class="container">

<div id="wordMode">
<div class="card">
<input type="file" accept="image/*" id="imageInput">
<div id="imageContainer">
<img id="previewImage">
<div id="selectionBox"></div>
</div>
<button class="primary" onclick="scanSelected()">🔍 Scan Area</button>
</div>

<div class="card">
<div id="editor" style="height:400px;"></div>
</div>
</div>

</div>

<script>

/* ===== INIT QUILL ===== */
let quill=new Quill('#editor',{theme:'snow'});

/* ===== IMAGE PREVIEW ===== */
const imageInput=document.getElementById("imageInput");
const previewImage=document.getElementById("previewImage");
const selectionBox=document.getElementById("selectionBox");
const container=document.getElementById("imageContainer");

imageInput.addEventListener("change",function(){
const file=this.files[0];
if(!file)return;
previewImage.src=URL.createObjectURL(file);
previewImage.style.display="block";
});

/* ===== CROP AREA ===== */
let startX,startY,endX,endY,isSelecting=false;

container.addEventListener("mousedown",(e)=>{
if(!previewImage.src)return;
isSelecting=true;
const rect=container.getBoundingClientRect();
startX=e.clientX-rect.left;
startY=e.clientY-rect.top;
selectionBox.style.left=startX+"px";
selectionBox.style.top=startY+"px";
selectionBox.style.width="0px";
selectionBox.style.height="0px";
selectionBox.style.display="block";
});

container.addEventListener("mousemove",(e)=>{
if(!isSelecting)return;
const rect=container.getBoundingClientRect();
endX=e.clientX-rect.left;
endY=e.clientY-rect.top;
selectionBox.style.width=Math.abs(endX-startX)+"px";
selectionBox.style.height=Math.abs(endY-startY)+"px";
selectionBox.style.left=Math.min(startX,endX)+"px";
selectionBox.style.top=Math.min(startY,endY)+"px";
});

container.addEventListener("mouseup",()=>{isSelecting=false;});

/* ===== FAST OCR WORKER ===== */
let worker;

async function initWorker(){
worker=await Tesseract.createWorker("eng");
}
initWorker();

/* ===== SCAN SELECTED AREA ===== */
async function scanSelected(){
if(!previewImage.src){alert("Pilih gambar dulu!");return;}

quill.root.innerHTML="⏳ Memproses OCR...";

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

const img=new Image();
img.src=previewImage.src;

img.onload=async()=>{
const scaleX=img.width/previewImage.width;
const scaleY=img.height/previewImage.height;

const x=parseInt(selectionBox.style.left||0)*scaleX;
const y=parseInt(selectionBox.style.top||0)*scaleY;
const w=parseInt(selectionBox.style.width||previewImage.width)*scaleX;
const h=parseInt(selectionBox.style.height||previewImage.height)*scaleY;

canvas.width=w;
canvas.height=h;
ctx.drawImage(img,x,y,w,h,0,0,w,h);

const {data:{text}}=await worker.recognize(canvas);

quill.root.innerHTML=text;
};
}

</script>
</body>
</html>
