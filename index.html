<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OCR Word Editor</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6fb;
  margin:0;
  padding:15px;
}

h2{
  text-align:center;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
  margin-bottom:20px;
}

#imageContainer{
  position:relative;
  display:inline-block;
  max-width:100%;
  touch-action:none;
  user-select:none;
}

#previewImage{
  max-width:100%;
  display:block;
  pointer-events:none;
  border-radius:8px;
}

#selectionBox{
  position:absolute;
  border:2px dashed #2196f3;
  background:rgba(33,150,243,0.2);
  display:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button:hover{
  background:#1e4fd8;
}

#editor{
  min-height:300px;
  border:1px solid #ddd;
  padding:15px;
  border-radius:8px;
  background:white;
  outline:none;
  line-height:1.6;
}

.toolbar{
  margin-bottom:10px;
}

.toolbar button{
  width:auto;
  padding:8px 10px;
  margin:3px;
  font-size:14px;
}

@media print{
  body *{
    visibility:hidden;
  }
  #editor, #editor *{
    visibility:visible;
  }
  #editor{
    position:absolute;
    left:0;
    top:0;
    width:100%;
  }
}
</style>
</head>

<body>

<h2>OCR Word Editor</h2>

<div class="card">
<input type="file" id="upload" accept="image/*"><br><br>

<div id="imageContainer">
<img id="previewImage">
<div id="selectionBox"></div>
</div>

<button onclick="scanArea()">🔍 Scan Area</button>
</div>

<div class="card">
<div class="toolbar">
<button onclick="format('bold')"><b>B</b></button>
<button onclick="format('italic')"><i>I</i></button>
<button onclick="format('underline')"><u>U</u></button>
<button onclick="format('insertUnorderedList')">• List</button>
<button onclick="format('justifyLeft')">Left</button>
<button onclick="format('justifyCenter')">Center</button>
<button onclick="format('justifyRight')">Right</button>
<button onclick="printDoc()">🖨 Print</button>
</div>

<div id="editor" contenteditable="true"></div>
</div>

<script>
const upload = document.getElementById("upload");
const img = document.getElementById("previewImage");
const container = document.getElementById("imageContainer");
const box = document.getElementById("selectionBox");
const editor = document.getElementById("editor");

let startX=0, startY=0, selecting=false;

upload.addEventListener("change", e=>{
  const reader = new FileReader();
  reader.onload = ()=>{
    img.src = reader.result;
  };
  reader.readAsDataURL(e.target.files[0]);
});

function getTouchPos(e){
  const rect = container.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: t.clientX - rect.left,
    y: t.clientY - rect.top
  };
}

container.addEventListener("touchstart", e=>{
  if(!img.src) return;
  e.preventDefault();
  selecting = true;
  const p = getTouchPos(e);
  startX = p.x;
  startY = p.y;
  box.style.display="block";
  box.style.left=startX+"px";
  box.style.top=startY+"px";
  box.style.width=0;
  box.style.height=0;
},{passive:false});

container.addEventListener("touchmove", e=>{
  if(!selecting) return;
  e.preventDefault();
  const p = getTouchPos(e);
  box.style.left=Math.min(startX,p.x)+"px";
  box.style.top=Math.min(startY,p.y)+"px";
  box.style.width=Math.abs(p.x-startX)+"px";
  box.style.height=Math.abs(p.y-startY)+"px";
},{passive:false});

container.addEventListener("touchend", ()=>{
  selecting=false;
});

async function scanArea(){
  if(!img.src){
    alert("Upload gambar dulu");
    return;
  }

  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");

  const scaleX = img.naturalWidth / img.clientWidth;
  const scaleY = img.naturalHeight / img.clientHeight;

  const x=parseInt(box.style.left)*scaleX;
  const y=parseInt(box.style.top)*scaleY;
  const w=parseInt(box.style.width)*scaleX;
  const h=parseInt(box.style.height)*scaleY;

  canvas.width=w;
  canvas.height=h;
  ctx.drawImage(img,x,y,w,h,0,0,w,h);

  editor.innerHTML="<p>Scanning...</p>";

  const { data } = await Tesseract.recognize(
    canvas,
    'ind',
    {
      tessedit_pageseg_mode:6,
      preserve_interword_spaces:1
    }
  );

  let text=data.text;

  text=text.replace(/[ \t]+/g," ");
  text=text.replace(/([a-z])\n([a-z])/gi,"$1 $2");
  text=text.replace(/\n•/g,"\n• ");
  text=text.replace(/\n-/g,"\n• ");
  text=text.replace(/\n{3,}/g,"\n\n");
  text=text.trim();

  editor.innerHTML=text
    .split("\n\n")
    .map(p=>`<p>${p}</p>`)
    .join("");
}

function format(cmd){
  document.execCommand(cmd,false,null);
}

function printDoc(){
  window.print();
}
</script>

</body>
</html>
